<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Companion Cat</title>
    <link rel="stylesheet" href="cat.css">
</head>
<body>

    <div class="park">
        <div class="grass"></div>
        
        <div class="info-box" id="emotion-display">Emotion: Resting 😴</div>
        <div class="info-box" id="energy-display">Energy: 100%</div>

        <div id="cat">
            <svg viewBox="0 0 100 75">
                <path d="M20,55 C30,65 70,65 80,55 L85,40 C80,25 60,25 50,35 L40,35 C30,25 15,30 20,40 Z" fill="#666"/>
                <g id="cat-head" style="transform-origin: 25px 35px;">
                    <circle cx="25" cy="35" r="15" fill="#666"/>
                    <circle id="cat-eye" cx="22" cy="33" r="3" fill="#32CD32"/>
                    <path id="cat-mouth" d="M23,42 C25,44 27,42 29,42" stroke="white" stroke-width="1" fill="none"/>
                    <path d="M10,25 L20,15 L25,25 Z" fill="#555"/>
                    <path d="M25,25 L35,15 L40,25 Z" fill="#555"/>
                    <path d="M5,35 L15,38" stroke="white" stroke-width="0.5"/>
                    <path d="M5,40 L15,40" stroke="white" stroke-width="0.5"/>
                </g>
                <path id="cat-tail" d="M80,50 Q95,40 90,20" stroke="#555" stroke-width="4" fill="none" style="transform-origin: 80px 50px;"/>
                <rect id="cat-leg-front" x="65" y="55" width="8" height="12" fill="#555" rx="4"/>
                <rect id="cat-leg-back" x="35" y="55" width="8" height="12" fill="#555" rx="4"/>
            </svg>
        </div>

        <div id="mouse-toy" class="toy"></div>
        <div id="yarn-toy" class="toy"></div>

    </div>

    <div id="toy-selector">
        <button id="select-mouse" class="toy-button active">Mouse</button>
        <button id="select-yarn" class="toy-button">Yarn</button>
    </div>

    <script src="cat.js"></script>
</body>
</html>
